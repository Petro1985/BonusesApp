# Production compose for a low-RAM VPS. SQLite lives in the app process.
# After first deploy:
#   sudo mkdir -p /etc/bonusesapp/logs /etc/bonusesapp/data
#   sudo chown -R 1654:1654 /etc/bonusesapp/logs /etc/bonusesapp/data
# TLS: /etc/bonusesapp/ssl must contain yourcert.pfx and authcert.pfx (see scripts/vps/00-SETUP-TLS.txt)
services:
  app:
    image: bonusesapp-app:latest
    ports:
      - "443:5001"
      - "80:8080"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Image defaults to HTTP-only (8080). Without HTTPS_PORTS, host :443 maps to a dead :5001 → SSL_ERROR_SYSCALL.
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=5001
      - ConnectionStrings__DefaultConnection=Data Source=/data/bonuses.db;Cache=Shared;Mode=ReadWriteCreate
      - Kestrel__Endpoints__Https__Url=https://*:5001
      - Kestrel__Endpoints__Https__Certificate__Path=/app/ssl-certs/yourcert.pfx
      - Kestrel__Endpoints__Https__Certificate__Password=
      - Kestrel__Endpoints__Http__Url=http://*:8080
      - OIDC__Certificates__Path=/app/ssl-certs/authcert.pfx
      - OIDC__Certificates__Password=123qwe!@#QWE
      - DOTNET_EnableDiagnostics=0
      - DOTNET_gcServer=0
    volumes:
      - /etc/bonusesapp/ssl:/app/ssl-certs:ro
      - /etc/bonusesapp/logs:/app/Logs
      - /etc/bonusesapp/data:/data
    restart: unless-stopped
