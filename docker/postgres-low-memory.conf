# Tuned for VPS with ~384 MiB RAM (Postgres container ~128 MiB limit).
# Applied via postgres -c flags in compose; this file is the reference copy.

shared_buffers = 16MB
effective_cache_size = 64MB
work_mem = 2MB
maintenance_work_mem = 16MB
max_connections = 20
wal_buffers = 1MB
max_wal_size = 128MB
autovacuum_max_workers = 1
checkpoint_completion_target = 0.9
