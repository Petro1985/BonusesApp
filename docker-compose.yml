version: '3.9'
services:
  app:
    build:
      context: .
      dockerfile: BonusesApp.Server/Dockerfile
    ports:
      - "443:5001"
      - "80:8080"
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - ConnectionStrings__DefaultConnection=Data Source=/data/bonuses.db;Cache=Shared;Mode=ReadWriteCreate
      - DOTNET_EnableDiagnostics=0
      - DOTNET_gcServer=0
    volumes:
      - sqlite-data:/data
volumes:
  sqlite-data:
